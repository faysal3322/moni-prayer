name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Clean previous build
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      # GitHub-এর Gradle ডাউনলোড সার্ভার মাঝে মাঝে 504 দেয়। তাই ৩ বার চেষ্টা
      # করা হয়; প্রথমবার ব্যর্থ হলে শুধু এই CI রানের জন্য মিরর সার্ভারে
      # সরে যায় (রিপোজিটরির gradle-wrapper.properties বদলায় না)।
      - name: Build APK
        run: |
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            echo "Build attempt $i failed, retrying..."
            sleep 20
            if [ "$i" = "1" ]; then
              sed -i 's#https\\://services.gradle.org/distributions#https\\://mirrors.cloud.tencent.com/gradle#' android/gradle/wrapper/gradle-wrapper.properties
            fi
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moni-prayer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
