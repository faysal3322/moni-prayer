plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.moni_prayer"
    compileSdk 36
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        // flutter_local_notifications v17+ এর জন্য প্রয়োজনীয় — এটা
        // ছাড়া build ব্যর্থ হতে পারে ("Cannot fit requested classes"
        // জাতীয় ত্রুটি সহ, java.time ব্যবহারের কারণে)।
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId "com.example.moni_prayer"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}
